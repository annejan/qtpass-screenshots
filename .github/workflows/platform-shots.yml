---
# SPDX-FileCopyrightText: 2026 Anne Jan Brouwer
# SPDX-License-Identifier: CC0-1.0

# Windows and macOS screenshots of a QtPass release for qtpass.org's
# "Looks at home on your desktop" tiles, light and dark, with the demo
# store of tools/demo-store.py. The second QtPass instance's search
# argument makes the running window search, expand and open the first
# match, so no input automation is needed.
name: Platform screenshots

on:
  push:
    branches: ["platform-shots"]
  workflow_dispatch:

permissions: {}

env:
  QTPASS_REF: v1.8.3

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The released installer, installed silently into a fixed folder.
      - name: Install the release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $v = $env:QTPASS_REF.TrimStart("v")
          Invoke-WebRequest "https://github.com/IJHack/QtPass/releases/download/$env:QTPASS_REF/qtpass-$v.exe" -OutFile "$env:RUNNER_TEMP\setup.exe"
          Start-Process "$env:RUNNER_TEMP\setup.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=C:\qtpass" -Wait
          Get-ChildItem C:\qtpass\qtpass.exe
      # Git for Windows' gpg (MSYS) wants GNUPGHOME as an MSYS path; a Windows
      # path it reads as relative to the working directory.
      - name: Demo store
        shell: pwsh
        timeout-minutes: 5
        run: |
          # D:\a\_temp\gnupg -> /d/a/_temp/gnupg, the MSYS form.
          $win = "$env:RUNNER_TEMP\gnupg"
          New-Item -ItemType Directory -Force $win | Out-Null
          $env:GNUPGHOME = "/" + $win.Substring(0, 1).ToLower() + $win.Substring(2).Replace("\", "/")
          "GNUPGHOME=$env:GNUPGHOME" >> $env:GITHUB_ENV
          # Room around the window for its shadow, clear of the desktop
          # icons (left) and the taskbar (bottom) on the 1024x768 screen.
          # QtPass 1.8 centres its window, so only the size counts: small
          # enough that window plus margin stay above the build watermark.
          $env:QTPASS_POS = "100 30"
          $env:QTPASS_SIZE = "780 460"
          python -u tools\demo-store.py "C:/Program Files/Git/usr/bin/gpg.exe" "$env:RUNNER_TEMP\store" C:\qtpass\qtpass.ini
      - name: Capture
        shell: pwsh
        timeout-minutes: 6
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force shots | Out-Null
          $key = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize"
          New-Item -Force -Path $key | Out-Null
          foreach ($scheme in "light", "dark") {
            $v = if ($scheme -eq "dark") { 0 } else { 1 }
            Set-ItemProperty $key AppsUseLightTheme $v -Type DWord
            Set-ItemProperty $key SystemUsesLightTheme $v -Type DWord
            Start-Sleep -Seconds 2
            # Nothing else on the desktop: the runner's console window would
            # show up in the black and the white capture alike.
            (New-Object -ComObject Shell.Application).MinimizeAll()
            Start-Sleep -Seconds 2
            $qp = Start-Process C:\qtpass\qtpass.exe -PassThru
            Start-Sleep -Seconds 8
            # "." matches everything, so every folder is expanded and loaded;
            # the filter hides folders it has not loaded yet. The second
            # search then selects and opens the first match.
            Start-Process C:\qtpass\qtpass.exe -ArgumentList "." -Wait
            Start-Sleep -Seconds 5
            Start-Process C:\qtpass\qtpass.exe -ArgumentList "example.com" -Wait
            Start-Sleep -Seconds 4
            Start-Process C:\qtpass\qtpass.exe -ArgumentList "example.com" -Wait
            Start-Sleep -Seconds 8
            $name = if ($scheme -eq "dark") { "windows-app-dark" } else { "windows-app" }
            & tools\capture-window.ps1 -ProcessId $qp.Id -Out "shots\$name"
            Stop-Process -Id $qp.Id -Force
            Start-Sleep -Seconds 2
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: windows-shots
          path: shots/

  # The black/white capture pairs become PNGs with real transparency.
  windows-finish:
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-shots
          path: pairs
      - name: Combine the pairs
        run: |
          sudo apt-get install -y -qq imagemagick >/dev/null
          command -v magick >/dev/null || sudo ln -s "$(command -v convert)" /usr/local/bin/magick
          mkdir -p shots
          for name in windows-app windows-app-dark; do
            tools/alpha-from-pair.sh "pairs/$name-black.png" "pairs/$name-white.png" "shots/$name.png"
          done
          identify shots/*.png
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-final
          path: shots/

  macos:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The released dmg; the app is copied out and un-quarantined, as the
      # macOS page tells users to.
      - name: Install the release
        run: |
          v="${QTPASS_REF#v}"
          curl -fsSL -o "$RUNNER_TEMP/qtpass.dmg" "https://github.com/IJHack/QtPass/releases/download/$QTPASS_REF/QtPass-$v.dmg"
          hdiutil attach -nobrowse -mountpoint "$RUNNER_TEMP/dmg" "$RUNNER_TEMP/qtpass.dmg"
          mkdir -p qtpass/main
          cp -R "$RUNNER_TEMP/dmg/QtPass.app" qtpass/main/
          hdiutil detach "$RUNNER_TEMP/dmg"
          xattr -dr com.apple.quarantine qtpass/main/QtPass.app || true
          ls qtpass/main/QtPass.app/Contents/MacOS/
      - name: Demo store
        run: |
          brew install gnupg
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          exe=$(ls qtpass/main/QtPass.app/Contents/MacOS/* | head -1)
          python3 tools/demo-store.py "$(command -v gpg)" "$RUNNER_TEMP/store" "$(dirname "$exe")/qtpass.ini"
          system_profiler SPDisplaysDataType | grep -i resolution || true
      - name: Capture
        timeout-minutes: 6
        run: |
          set -x
          mkdir -p shots
          exe=$(ls qtpass/main/QtPass.app/Contents/MacOS/* | grep -v '\.ini$' | head -1)
          for scheme in light dark; do
            if [ "$scheme" = dark ]; then dark=true name=macos-app-dark.png; else dark=false name=macos-app.png; fi
            osascript -e "tell application \"System Events\" to tell appearance preferences to set dark mode to $dark" \
              || echo "could not switch dark mode to $dark"
            sleep 2
            "$exe" > "shots/qtpass-$scheme.log" 2>&1 &
            qp=$!
            sleep 10
            # "." matches everything, so every folder is expanded and loaded;
            # the filter hides folders it has not loaded yet. The second
            # search then selects and opens the first match.
            "$exe" '.' >> "shots/qtpass-$scheme.log" 2>&1 || true
            sleep 5
            "$exe" 'example.com' >> "shots/qtpass-$scheme.log" 2>&1 || true
            sleep 4
            "$exe" 'example.com' >> "shots/qtpass-$scheme.log" 2>&1 || true
            sleep 8
            ps -p "$qp" -o pid,stat,command || echo "QtPass ($qp) is not running"
            id=$(swift tools/window-id.swift "$qp" --list) || {
              cat "shots/qtpass-$scheme.log"
              screencapture -x "shots/screen-$scheme.png" || true
              exit 1
            }
            screencapture -x -l "$id" "shots/$name"
            kill "$qp"; wait "$qp" 2>/dev/null || true
            sleep 2
          done
          ls -l shots
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: macos-shots
          path: shots/

  freebsd:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # FreeBSD's qtpass package lags (1.8.2), so the release is built from
      # source, as QtPass's own FreeBSD CI does; Xfce's window manager with
      # the Greybird theme on Xvfb gives the desktop.
      - name: Build and capture in a FreeBSD VM
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          release: "14"
          usesh: true
          mem: 6144
          cpu: 3
          sync: rsync
          copyback: true
          envs: "QTPASS_REF"
          prepare: |
            pkg install -y qt6-base qt6-tools qt6-svg gnupg git python3 \
              xorg-vfbserver xkbcomp xauth xdotool xprop xwininfo ImageMagick7 \
              noto-basic dbus xfce4-wm xfce4-conf greybird-theme \
              xfce-icons-elementary
          run: |
            set -e
            git clone -q --depth 1 -b "$QTPASS_REF" https://github.com/IJHack/QtPass.git qtpass
            cd qtpass && qmake6 qtpass.pro CONFIG+=release >/dev/null && make -j3 >/dev/null && cd ..
            ls -l qtpass/main/qtpass
            sh tools/freebsd-shots.sh qtpass/main/qtpass
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: freebsd-shots
          path: shots/

  gnome:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the desktop packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential libgl-dev libgtk-3-0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            gnupg xvfb x11-utils xdotool imagemagick dbus-x11 mutter \
            gnome-themes-extra adwaita-icon-theme fonts-cantarell \
            gsettings-desktop-schemas dconf-gsettings-backend wmctrl \
            xdg-desktop-portal xdg-desktop-portal-gtk >/dev/null
      # Qt 6.8, whose GTK platform theme follows the dark setting (Ubuntu's
      # 6.4 does not); Ubuntu's own qtpass package is older anyway.
      - uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: "6.8"
          cache: true
      - name: Build QtPass
        run: |
          git clone -q --depth 1 -b "$QTPASS_REF" https://github.com/IJHack/QtPass.git qtpass
          cd qtpass && qmake qtpass.pro CONFIG+=release >/dev/null && make -j"$(nproc)" >/dev/null
          ls -l main/qtpass "$QT_ROOT_DIR/plugins/platformthemes/"
      - name: Capture
        timeout-minutes: 8
        run: |
          command -v magick >/dev/null || sudo ln -s "$(command -v convert)" /usr/local/bin/magick
          tools/gnome-shots.sh qtpass/main/qtpass
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: gnome-shots
          path: shots/
