---
# SPDX-FileCopyrightText: 2026 Anne Jan Brouwer
# SPDX-License-Identifier: CC0-1.0

# Windows and macOS screenshots of a QtPass release for qtpass.org's
# "Looks at home on your desktop" tiles, light and dark, with the demo
# store of tools/demo-store.py. The second QtPass instance's search
# argument makes the running window search, expand and open the first
# match, so no input automation is needed.
name: Platform screenshots

on:
  push:
    branches: ["platform-shots"]
  workflow_dispatch:

permissions: {}

env:
  QTPASS_REF: v1.8.3

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The released installer, installed silently into a fixed folder.
      - name: Install the release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $v = $env:QTPASS_REF.TrimStart("v")
          Invoke-WebRequest "https://github.com/IJHack/QtPass/releases/download/$env:QTPASS_REF/qtpass-$v.exe" -OutFile "$env:RUNNER_TEMP\setup.exe"
          Start-Process "$env:RUNNER_TEMP\setup.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=C:\qtpass" -Wait
          Get-ChildItem C:\qtpass\qtpass.exe
      # GnuPG for Windows, as Gpg4win installs it; Git's MSYS gpg does not
      # take Windows paths in GNUPGHOME.
      - name: Install GnuPG
        shell: pwsh
        timeout-minutes: 6
        run: |
          choco install gnupg -y --no-progress
          $gpg = Get-ChildItem "C:\Program Files*\GnuPG\bin\gpg.exe" | Select-Object -First 1 -ExpandProperty FullName
          if (-not $gpg) { throw "gpg.exe not found after choco install gnupg" }
          & $gpg --version | Select-Object -First 1
          "GPG=$gpg" >> $env:GITHUB_ENV
      - name: Demo store
        shell: pwsh
        timeout-minutes: 5
        run: |
          $env:GNUPGHOME = "$env:RUNNER_TEMP\gnupg"
          "GNUPGHOME=$env:GNUPGHOME" >> $env:GITHUB_ENV
          python -u tools\demo-store.py $env:GPG "$env:RUNNER_TEMP\store" C:\qtpass\qtpass.ini
          Add-Type -AssemblyName System.Windows.Forms
          [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
      - name: Capture
        shell: pwsh
        timeout-minutes: 6
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force shots | Out-Null
          $key = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize"
          New-Item -Force -Path $key | Out-Null
          foreach ($scheme in "light", "dark") {
            $v = if ($scheme -eq "dark") { 0 } else { 1 }
            Set-ItemProperty $key AppsUseLightTheme $v -Type DWord
            Set-ItemProperty $key SystemUsesLightTheme $v -Type DWord
            Start-Sleep -Seconds 2
            $qp = Start-Process C:\qtpass\qtpass.exe -PassThru
            Start-Sleep -Seconds 8
            # Twice: the first search expands and loads the folders, the
            # second selects and opens the first match.
            Start-Process C:\qtpass\qtpass.exe -ArgumentList "mail.example.com|social|web|acme|wiki" -Wait
            Start-Sleep -Seconds 4
            Start-Process C:\qtpass\qtpass.exe -ArgumentList "mail.example.com|social|web|acme|wiki" -Wait
            Start-Sleep -Seconds 8
            $name = if ($scheme -eq "dark") { "windows-app-dark.png" } else { "windows-app.png" }
            & tools\capture-window.ps1 -ProcessId $qp.Id -Out "shots\$name"
            Stop-Process -Id $qp.Id -Force
            Start-Sleep -Seconds 2
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: windows-shots
          path: shots/

  macos:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The released dmg; the app is copied out and un-quarantined, as the
      # macOS page tells users to.
      - name: Install the release
        run: |
          v="${QTPASS_REF#v}"
          curl -fsSL -o "$RUNNER_TEMP/qtpass.dmg" "https://github.com/IJHack/QtPass/releases/download/$QTPASS_REF/QtPass-$v.dmg"
          hdiutil attach -nobrowse -mountpoint "$RUNNER_TEMP/dmg" "$RUNNER_TEMP/qtpass.dmg"
          mkdir -p qtpass/main
          cp -R "$RUNNER_TEMP/dmg/QtPass.app" qtpass/main/
          hdiutil detach "$RUNNER_TEMP/dmg"
          xattr -dr com.apple.quarantine qtpass/main/QtPass.app || true
          ls qtpass/main/QtPass.app/Contents/MacOS/
      - name: Demo store
        run: |
          brew install gnupg
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          exe=$(ls qtpass/main/QtPass.app/Contents/MacOS/* | head -1)
          python3 tools/demo-store.py "$(command -v gpg)" "$RUNNER_TEMP/store" "$(dirname "$exe")/qtpass.ini"
          system_profiler SPDisplaysDataType | grep -i resolution || true
      - name: Capture
        timeout-minutes: 6
        run: |
          set -x
          mkdir -p shots
          exe=$(ls qtpass/main/QtPass.app/Contents/MacOS/* | grep -v '\.ini$' | head -1)
          for scheme in light dark; do
            # -AppleInterfaceStyle in the argument domain sets this app's
            # appearance; QtPass takes it as search text, which the second
            # instance's search below replaces.
            if [ "$scheme" = dark ]; then
              appearance=(-AppleInterfaceStyle Dark); name=macos-app-dark.png
            else
              appearance=(-AppleInterfaceStyle Light); name=macos-app.png
            fi
            "$exe" "${appearance[@]}" > "shots/qtpass-$scheme.log" 2>&1 &
            qp=$!
            sleep 10
            # Twice: the first search expands and loads the folders, the
            # second selects and opens the first match.
            "$exe" 'mail.example.com|social|web|acme|wiki' >> "shots/qtpass-$scheme.log" 2>&1 || true
            sleep 4
            "$exe" 'mail.example.com|social|web|acme|wiki' >> "shots/qtpass-$scheme.log" 2>&1 || true
            sleep 8
            ps -p "$qp" -o pid,stat,command || echo "QtPass ($qp) is not running"
            id=$(swift tools/window-id.swift "$qp" --list) || {
              cat "shots/qtpass-$scheme.log"
              screencapture -x "shots/screen-$scheme.png" || true
              exit 1
            }
            screencapture -x -l "$id" "shots/$name"
            kill "$qp"; wait "$qp" 2>/dev/null || true
            sleep 2
          done
          ls -l shots
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: macos-shots
          path: shots/
